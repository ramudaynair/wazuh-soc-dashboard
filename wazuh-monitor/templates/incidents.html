{% extends "base.html" %}

{% block title %}Incidents — Wazuh Monitor{% endblock %}
{% block page_title %}Incidents{% endblock %}

{% block content %}
<div class="panel">
    <div class="panel-head">
        <span class="panel-title">🚨 Correlated Incidents</span>
        <span class="panel-badge" id="incidentCount">0 incidents</span>
    </div>
    
    <!-- Filter bar -->
    <div class="filter-bar">
        <select id="severityFilter" class="filter-select" onchange="loadIncidents()">
            <option value="">All Severities</option>
            <option value="Critical">Critical</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
        </select>
        <input type="text" id="hostFilter" class="filter-input" placeholder="Search by host..." oninput="loadIncidents()">
    </div>

    <!-- Table content -->
    <div class="tbl-wrap">
        <table>
            <thead>
                <tr>
                    <th>Severity</th>
                    <th>Incident ID</th>
                    <th>Title</th>
                    <th>Host</th>
                    <th>Timestamp</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="incidentsTbody">
                <tr>
                    <td colspan="6">
                        <div class="empty-state">
                            <div class="empty-icon">🔍</div>
                            <div class="empty-text">Loading incidents...</div>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination Footer -->
    <div class="table-footer">
        <span id="pageInfo">Showing 0-0 of 0 incidents</span>
        <div class="page-btns">
            <button class="page-btn" id="prevBtn" onclick="prevPage()">Previous</button>
            <button class="page-btn" id="nextBtn" onclick="nextPage()">Next</button>
        </div>
    </div>
</div>

<!-- Details Modal/Drawer Integration -->
<script>
    let currentPage = 1;
    const pageSize = 15;
    let totalItems = 0;
    let allIncidents = [];

    document.addEventListener("DOMContentLoaded", () => {
        loadIncidents();
    });

    async function loadIncidents() {
        try {
            const res = await fetch("/api/incidents?limit=100&offset=0");
            const data = await res.json();
            allIncidents = data.items || [];
            filterAndRender();
        } catch (err) {
            console.error("Failed to load incidents:", err);
        }
    }

    function filterAndRender() {
        const severity = document.getElementById("severityFilter").value;
        const host = document.getElementById("hostFilter").value.toLowerCase();

        let filtered = allIncidents;
        if (severity) {
            filtered = filtered.filter(inc => inc.severity === severity);
        }
        if (host) {
            filtered = filtered.filter(inc => inc.host.toLowerCase().includes(host));
        }

        totalItems = filtered.length;
        document.getElementById("incidentCount").textContent = `${totalItems} incidents`;

        const start = (currentPage - 1) * pageSize;
        const end = Math.min(start + pageSize, totalItems);
        const paginated = filtered.slice(start, end);

        renderTable(paginated);
        updatePagination(start, end);
    }

    function renderTable(items) {
        const tbody = document.getElementById("incidentsTbody");
        if (!items || items.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="6">
                        <div class="empty-state">
                            <div class="empty-icon">🛡️</div>
                            <div class="empty-text">No security incidents correlated</div>
                        </div>
                    </td>
                </tr>`;
            return;
        }

        tbody.innerHTML = items.map(inc => {
            let badgeClass = "badge-info";
            if (inc.severity === "Critical") badgeClass = "badge-critical";
            else if (inc.severity === "High") badgeClass = "badge-high";
            else if (inc.severity === "Medium") badgeClass = "badge-medium";
            else if (inc.severity === "Low") badgeClass = "badge-low";

            return `
                <tr onclick="showIncidentDetail('${inc.id}')">
                    <td><span class="badge ${badgeClass}">${inc.severity}</span></td>
                    <td class="mono">${inc.id}</td>
                    <td class="primary" style="font-weight:600">${inc.title}</td>
                    <td>${inc.host}</td>
                    <td>${inc.timestamp}</td>
                    <td>
                        <button class="page-btn" style="border-color:var(--wazuh); color:var(--wazuh)">Investigate</button>
                    </td>
                </tr>
            `;
        }).join("");
    }

    function updatePagination(start, end) {
        document.getElementById("pageInfo").textContent = `Showing ${totalItems > 0 ? start + 1 : 0}-${end} of ${totalItems} incidents`;
        document.getElementById("prevBtn").disabled = (currentPage === 1);
        document.getElementById("nextBtn").disabled = (end >= totalItems);
    }

    function prevPage() {
        if (currentPage > 1) {
            currentPage--;
            filterAndRender();
        }
    }

    function nextPage() {
        if (currentPage * pageSize < totalItems) {
            currentPage++;
            filterAndRender();
        }
    }

    function showIncidentDetail(incId) {
        const inc = allIncidents.find(i => i.id === incId);
        if (!inc) return;
        openIncidentDrawer(inc);
    }
</script>
{% endblock %}
